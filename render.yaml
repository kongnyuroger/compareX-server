services:
  - type: web
    name: comparex-server
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: MONGO_URI
        sync: false        # you'll fill this in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false